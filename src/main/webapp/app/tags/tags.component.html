<div>
    <mat-toolbar color="primary">
        <h1>Referee Coach</h1>
        <span class="spacer"></span>
        <a routerLink="/" mat-icon-button>
            <mat-icon>home</mat-icon>
        </a>
    </mat-toolbar>

    <mat-card appearance="outlined">
        <mat-card-content>
            <mat-form-field>
                <mat-label>Search</mat-label>
                <input matInput (keyup)="applyFilter($event)" #input>
            </mat-form-field>

            <table mat-table [dataSource]="dataSource">
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let tag"> {{ tag.name }}</td>
                </ng-container>

                <ng-container matColumnDef="usageCount">
                    <th mat-header-cell *matHeaderCellDef>Used</th>
                    <td mat-cell *matCellDef="let tag"> {{ tag.usageCount }}</td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let tag" class="actions">
                        <button mat-icon-button (click)="openRenameTagDialog(tag)" matTooltip="Rename">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <span [matTooltip]="tag.usageCount > 0 ? 'Tag is in use and cannot be deleted' : 'Delete'">
                            <button mat-icon-button (click)="openDeleteTagDialog(tag)" [disabled]="tag.usageCount > 0">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </span>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <mat-paginator [pageSizeOptions]="[10, 20, 50]" [pageSize]="50" showFirstLastButtons></mat-paginator>
        </mat-card-content>
    </mat-card>
    <button mat-fab color="primary" class="fab" (click)="openCreateTagDialog()" matTooltip="Create Tag">
        <mat-icon>add</mat-icon>
    </button>
</div>

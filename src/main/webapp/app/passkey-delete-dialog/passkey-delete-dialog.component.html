<h2 mat-dialog-title>Delete Passkey</h2>
<mat-dialog-content class="mat-typography">
    <p>Are you sure you want to delete the passkey "{{ dto.name }}"?</p>
    <p>You will no longer be able to log in with it. Please also remove it from your password manager or device.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-flat-button [mat-dialog-close]="false">Cancel</button>
    <button color="primary" mat-flat-button [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
